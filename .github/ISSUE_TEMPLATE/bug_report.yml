name: "🐛 Bug Report"
description: "File a report about a bug or unexpected behavior in the Blog API."
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When calling POST /api/v1/posts, the service returns 500 instead of 400..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run './mvnw spring-boot:run'
        2. Send HTTP request 'POST /api/v1/posts' with body '...'
        3. Observe the response
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Expected HTTP 400 Bad Request with Problem Detail body..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Trace
      description: Paste any terminal output, server logs, or stack traces here.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have verified this bug against the latest `main` branch.
          required: true
