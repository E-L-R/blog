# Local development: ./mvnw spring-boot:run turns this profile on (see pom.xml).

# A committed secret, so the app starts without setup. It is public, so the application
# refuses it unless the dev profile is active (see JwtConfiguration).
blog.auth.jwt.secret=ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbiE=

# Common ports of local frontend dev servers
blog.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# A local model on Ollama writes the TL;DRs and replies: no API key or account needed.
# Install Ollama and run `ollama pull llama3.2` once (README.md, Quick start).
# Without Ollama, start with --blog.ai.fake=true for fixed answers instead.
blog.ai.provider=ollama
blog.ai.llm.model=llama3.2

# A laptop runs one model call at a time, and the first call waits while Ollama loads the
# model, so each call may take up to 3 minutes. The lease must stay longer than the timeout.
blog.ai.worker.concurrency=1
blog.ai.llm.timeout=180s
blog.ai.worker.lease=5m
