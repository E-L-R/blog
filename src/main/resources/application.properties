spring.application.name=blog

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks at startup
# that the entities match the tables, and never creates or changes them itself.
spring.jpa.hibernate.ddl-auto=validate

# Keep the database session out of the web layer: every query runs inside a service transaction.
spring.jpa.open-in-view=false

# Authentication. The secret has no default: it must come from the environment
# (BLOG_AUTH_JWT_SECRET), and the application refuses to start without it.
# It is a Base64-encoded random key of at least 32 bytes, for example: openssl rand -base64 32
blog.auth.token-ttl=1h

# Browser origins allowed to call the API (comma-separated). None by default.
blog.cors.allowed-origins=

# AI features. The model, timeouts and worker settings have defaults in AiProperties
# (see docs/OPERATIONS.md). Calls to Claude need ANTHROPIC_API_KEY in the environment.
blog.ai.llm.model=claude-opus-5-5

# Health checks: /actuator/health, with /liveness and /readiness for the platform.
# Readiness includes the database. No other Actuator endpoint is exposed over HTTP.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# API docs: /v3/api-docs and /swagger-ui.html. Error responses are described in docs/API.md;
# without this, springdoc would list every error the advice can produce on every operation.
springdoc.override-with-generic-response=false
